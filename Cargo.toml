[package]
name = "gap"
version = "0.1.0"
edition = "2021"
description = "GAP — Geta Agent Protocol. Reference implementation in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/autonomous-lab/GAP"
keywords = ["agent", "protocol", "ai", "identity", "escrow"]
categories = ["network-programming", "cryptography"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ureq = "3.3.0"
tiny_http = "0.12.0"
k256 = { version = "0.14.0", features = ["ecdsa"] }
chacha20poly1305 = "0.10.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
hkdf = "0.12.4"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
rand_core = "0.10.1"
base64 = "0.22.1"
hmac = "0.12.1"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.6.0"

[[bench]]
name = "protocol"
harness = false
