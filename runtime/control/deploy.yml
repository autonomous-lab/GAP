# Single operator authority: deploy once, not once per execution node.
# Separate compose project so node CI cannot remove it as an orphan.
name: gap-control
services:
  control:
    build:
      context: .
      dockerfile: runtime/control/Dockerfile
    ports: ["172.17.0.1:8096:8096"]
    volumes:
      - ./data/gap-control/config:/config:ro
      - ./data/gap-control/state:/data
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/health',timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6
