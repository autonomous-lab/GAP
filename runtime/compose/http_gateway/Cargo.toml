[package]
name = "gap-vm-http-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "server", "tokio"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
