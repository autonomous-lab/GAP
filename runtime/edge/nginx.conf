worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream gap_node { server gap-node:8080; }
  upstream gap_realtime { server gap-realtime:8091; }

  # This origin is exclusively for privileged administration. All paths go
  # through GAP's administrator boundary, including /apps and realtime.
  server {
    listen 8080;
    server_name ${GAP_ADMIN_HOST};
    client_max_body_size 16k;
    location / {
      proxy_pass http://gap_node;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }
  }

  server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 5m;

    location = /edge-health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    location = /v1/realtime {
      proxy_pass http://gap_realtime/v1/realtime;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    location = /_gap/realtime {
      proxy_pass http://gap_realtime/v1/realtime;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-GAP-Custom-Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # Shared-origin Compose applications; the optional gateway owns VM routing.
    # A literal private address keeps the ordinary edge independent of startup
    # or DNS resolution of the optional Compose services.
    location ^~ /apps/ {
      proxy_pass http://172.17.0.1:8093;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://gap_node;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Authorization $http_authorization;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_buffering off;
    }
  }
}
