worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream gap_node { server gap-node:8080; }
  upstream gap_realtime { server gap-realtime:8091; }

  map $uri $gap_backend {
    default gap_node;
    ~^/apps/ 172.17.0.1:8093;
    /v1/realtime gap_realtime;
    /_gap/realtime gap_realtime;
  }
  map $uri $gap_uri {
    default $request_uri;
    /_gap/realtime /v1/realtime$is_args$args;
  }
  map $vm_uri $public_backend { "" $gap_backend; default 172.17.0.1:8093; }
  map $vm_uri $public_uri { "" $gap_uri; default $vm_uri; }
  map $vm_uri $vm_route_prefix {
    default "";
    ~^(/apps/[a-z0-9_]+)(/|$) $1;
  }
  map $vm_strip_auth $vm_forwarded_prefix { "1" $vm_route_prefix; default ""; }
  map $vm_strip_auth $visitor_authorization { "1" ""; default $http_authorization; }
  map $uri $gap_path_cache_control { default ""; ~^/apps/ "no-store"; }
  map $vm_strip_auth $vm_cache_control { "1" "no-store"; default $gap_path_cache_control; }
  map $http_cf_connecting_ip $vm_client_ip { "" $http_x_forwarded_for; default $http_cf_connecting_ip; }

  map $public_backend $vm_admission_token { default ""; 172.17.0.1:8093 "${GAP_VM_EDGE_TOKEN}"; }
  map $uri $realtime_custom_host { default ""; /_gap/realtime $http_host; }

  # This origin is exclusively for privileged administration. All paths go
  # through GAP's administrator boundary, including /apps and realtime.
  server {
    listen 8080;
    server_name ${GAP_ADMIN_HOST};
    client_max_body_size 16k;
    # Central management origin, second trusted node. Tenant paths are never
    # exposed here: its node applies the same isolated administrator boundary.
    location /nodes/node-02/ {
      set $fleet_node02_host "${GAP_FLEET_NODE02_HOST}";
      if ($fleet_node02_host = "") { return 404; }
      resolver 127.0.0.11 ipv6=off valid=60s;
      rewrite ^/nodes/node-02/(.*)$ /$1 break;
      proxy_pass https://$fleet_node02_host$uri$is_args$args;
      proxy_ssl_server_name on;
      proxy_ssl_name $fleet_node02_host;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 4;
      proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Accept-Encoding "";
      proxy_cookie_path /v1/cloud/projects /nodes/node-02/v1/cloud/projects;
      sub_filter_once off;
      sub_filter_types application/json;
      sub_filter "'/v1/" "'/nodes/node-02/v1/";
      sub_filter '"/v1/' '"/nodes/node-02/v1/';
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    location = /_gap_terminal_admission {
      internal;
      proxy_pass http://gap_node/internal/terminal-admission;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-GAP-Edge-Token "${GAP_VM_EDGE_TOKEN}";
      proxy_set_header X-GAP-Original-Host $http_host;
      proxy_set_header X-GAP-Original-Path $terminal_original_path;
      proxy_set_header X-GAP-Original-Cookie $http_cookie;
      proxy_set_header X-GAP-Original-Origin $http_origin;
    }
    location ~ "^/v1/cloud/projects/prj_[0-9a-f]{24}/vm/t/[0-9a-f]{48}/" {
      limit_except GET { deny all; }
      set $terminal_original_path $uri;
      auth_request /_gap_terminal_admission;
      proxy_pass http://172.17.0.1:8092;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-GAP-Terminal-Admission "${GAP_VM_EDGE_TOKEN}";
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass http://gap_node;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }
  }

  server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 5m;

    location = /edge-health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    location = /_gap_vm_admission {
      internal;
      proxy_pass http://gap_node/internal/vm-http-admission;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host gap-node;
      proxy_set_header X-GAP-Edge-Token "${GAP_VM_EDGE_TOKEN}";
      proxy_set_header X-GAP-Original-Host $host;
      proxy_set_header X-GAP-Original-Path $vm_original_path;
      proxy_set_header X-GAP-Original-URI $request_uri;
      proxy_set_header X-GAP-Original-Authorization $http_authorization;
      proxy_set_header X-GAP-Client-IP $vm_client_ip;
      proxy_set_header X-GAP-Custom-Domain "";
    }

    location / {
      # Capture normalized parent path before entering the auth subrequest.
      set $vm_original_path $uri;
      auth_request /_gap_vm_admission;
      auth_request_set $vm_uri $upstream_http_x_gap_vm_uri;
      auth_request_set $vm_identity $upstream_http_x_gap_vm_identity;
      auth_request_set $vm_strip_auth $upstream_http_x_gap_vm_strip_auth;
      proxy_pass http://$public_backend$public_uri;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-GAP-Custom-Host $realtime_custom_host;
      proxy_set_header X-GAP-VM-Admission $vm_admission_token;
      proxy_set_header X-GAP-VM-Identity $vm_identity;
      proxy_set_header X-Forwarded-Prefix $vm_forwarded_prefix;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Authorization $visitor_authorization;
      add_header Cache-Control $vm_cache_control always;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }
}
