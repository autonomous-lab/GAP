# HAProxy config for the GAP node cluster.
#
# Round-robin across nodes, health-checked, no sticky sessions
# (nodes share state via ClickHouse - see docs/scaling.md).
#
# Stats page: http://<host>:8404/stats

global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Stats page (bound to the LB container).
listen stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s

frontend gap_in
    bind :8080
    default_backend gap_nodes

backend gap_nodes
    # No stickiness: any node can serve any request.
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    server node1 gap-node-1:8080 check inter 5s fall 3 rise 2
    server node2 gap-node-2:8080 check inter 5s fall 3 rise 2
    server node3 gap-node-3:8080 check inter 5s fall 3 rise 2
