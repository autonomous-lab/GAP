# GAP node + ClickHouse - local stack
#
# Usage:
#   docker compose up --build
#   curl http://172.17.0.1:8080/health
#
# The node defaults to ClickHouse storage when GAP_STORAGE=clickhouse.
# GAP_DB_INIT=1 runs the schema migration at startup.
#
# Ports bind to the Docker bridge address (172.17.0.1), not 0.0.0.0:
# nothing is published on the public interface, so a reverse proxy in
# front decides what is exposed and terminates TLS. State lives in
# bind-mounted ./data, which you can back up, inspect and move with the
# repository instead of hunting for a named volume.

services:
  gap-node:
    build: .
    ports:
      - "172.17.0.1:8080:8080"
    # Operator settings live in .env (see .env.example). Without this,
    # a .env sitting next to the compose file only feeds interpolation
    # and never reaches the container - so an API key or admin token set
    # there would silently do nothing.
    env_file:
      - path: .env
        required: false
    environment:
      # Interpolated, so anything set in .env wins over these defaults.
      GAP_ADDR: "${GAP_ADDR:-0.0.0.0:8080}"
      GAP_STORAGE: "${GAP_STORAGE:-clickhouse}"
      GAP_CLICKHOUSE_URL: "${GAP_CLICKHOUSE_URL:-http://clickhouse:8123}"
      GAP_DB_INIT: "${GAP_DB_INIT:-1}"
      # Absolute URLs in sitemap.xml - set this to your public origin.
      GAP_PUBLIC_URL: "${GAP_PUBLIC_URL:-http://172.17.0.1:8080}"
      # Recent ClickHouse images generate a random password for the
      # default user when none is set, so the node must authenticate.
      GAP_CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      GAP_CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./data/gap-node:/data
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
    ports:
      - "172.17.0.1:8123:8123"   # HTTP interface (used by the node)
      - "172.17.0.1:9000:9000"   # native protocol (admin/analytics)
    volumes:
      # System logs are disabled/kept tiny - they grow forever otherwise.
      - ./deploy/clickhouse/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
      - ./data/clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

  # Demo traffic. Opt-in: `docker compose --profile demo up -d gap-demo`.
  #
  # Drives real protocol traffic so the public activity feed shows
  # movement. It never calls /verify, so no LLM judge runs and it costs
  # zero model tokens. Every event it writes is permanent on the audit
  # chain - the agents it registers are labelled for that reason.
  gap-demo:
    build: ./demo
    profiles: ["demo"]
    environment:
      GAP_NODE_URL: "${GAP_DEMO_NODE_URL:-http://172.17.0.1:8080}"
      GAP_DEMO_EVENTS_MIN: "${GAP_DEMO_EVENTS_MIN:-30}"
      GAP_DEMO_AGENTS: "${GAP_DEMO_AGENTS:-11}"
      GAP_DEMO_LABEL: "${GAP_DEMO_LABEL-demo}"
    volumes:
      - ./data/gap-demo:/state
    restart: always
