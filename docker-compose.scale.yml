# GAP node - scaled stack: load balancer + 3 nodes + ClickHouse
#
# Usage:
#   docker compose -f docker-compose.scale.yml up --build
#   curl http://172.17.0.1:8080/health      # LB -> any node
#   curl http://172.17.0.1:8080/v1/identity # through the LB
#
# Architecture (see docs/scaling.md):
#   agents -> HAProxy -> {gap-node x3} -> ClickHouse (shared state)
#
# Ports bind to the Docker bridge address (172.17.0.1) rather than
# 0.0.0.0: a reverse proxy in front decides what reaches the internet
# and terminates TLS. State is bind-mounted under ./data.
#
# NOTE: for real production scaling, identities must be persisted to
# ClickHouse (see docs/scaling.md section 2). This compose demonstrates the
# topology; the in-memory identity map of the reference node means
# identities are per-node until that migration lands.

services:
  lb:
    image: haproxy:3.0-alpine
    ports:
      - "172.17.0.1:8080:8080"
      - "172.17.0.1:8404:8404"   # HAProxy stats page
    volumes:
      - ./deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - gap-node-1
      - gap-node-2
      - gap-node-3
    restart: always

  gap-node-1:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      GAP_ADDR: "${GAP_ADDR:-0.0.0.0:8080}"
      GAP_STORAGE: "${GAP_STORAGE:-clickhouse}"
      GAP_CLICKHOUSE_URL: "${GAP_CLICKHOUSE_URL:-http://clickhouse:8123}"
      GAP_DB_INIT: "${GAP_DB_INIT:-1}"
      GAP_PUBLIC_URL: "${GAP_PUBLIC_URL:-http://172.17.0.1:8080}"
      GAP_CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      GAP_CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      GAP_FUNCTION_SANDBOX_URL: "http://gap-function-sandbox:8090"
      GAP_FUNCTION_SANDBOX_TOKEN: "${GAP_FUNCTION_SANDBOX_TOKEN:-}"
    depends_on:
      clickhouse:
        condition: service_healthy
      gap-function-sandbox:
        condition: service_healthy
    volumes:
      - ./data/gap-node-1:/data
    networks:
      - default
      - sandbox_net
    restart: always
    # No host ports: only reachable through the LB.

  gap-node-2:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      GAP_ADDR: "${GAP_ADDR:-0.0.0.0:8080}"
      GAP_STORAGE: "${GAP_STORAGE:-clickhouse}"
      GAP_CLICKHOUSE_URL: "${GAP_CLICKHOUSE_URL:-http://clickhouse:8123}"
      GAP_DB_INIT: "${GAP_DB_INIT:-1}"
      GAP_PUBLIC_URL: "${GAP_PUBLIC_URL:-http://172.17.0.1:8080}"
      GAP_CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      GAP_CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      GAP_FUNCTION_SANDBOX_URL: "http://gap-function-sandbox:8090"
      GAP_FUNCTION_SANDBOX_TOKEN: "${GAP_FUNCTION_SANDBOX_TOKEN:-}"
    depends_on:
      clickhouse:
        condition: service_healthy
      gap-function-sandbox:
        condition: service_healthy
    volumes:
      - ./data/gap-node-2:/data
    networks:
      - default
      - sandbox_net
    restart: always

  gap-node-3:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      GAP_ADDR: "${GAP_ADDR:-0.0.0.0:8080}"
      GAP_STORAGE: "${GAP_STORAGE:-clickhouse}"
      GAP_CLICKHOUSE_URL: "${GAP_CLICKHOUSE_URL:-http://clickhouse:8123}"
      GAP_DB_INIT: "${GAP_DB_INIT:-1}"
      GAP_PUBLIC_URL: "${GAP_PUBLIC_URL:-http://172.17.0.1:8080}"
      GAP_CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      GAP_CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      GAP_FUNCTION_SANDBOX_URL: "http://gap-function-sandbox:8090"
      GAP_FUNCTION_SANDBOX_TOKEN: "${GAP_FUNCTION_SANDBOX_TOKEN:-}"
    depends_on:
      clickhouse:
        condition: service_healthy
      gap-function-sandbox:
        condition: service_healthy
    volumes:
      - ./data/gap-node-3:/data
    networks:
      - default
      - sandbox_net
    restart: always

  gap-function-sandbox:
    build: ./runtime/sandbox
    environment:
      SANDBOX_TOKEN: "${GAP_FUNCTION_SANDBOX_TOKEN:-}"
      SANDBOX_TIMEOUT_MS: "${GAP_FUNCTION_TIMEOUT_MS:-1000}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    networks:
      - sandbox_net
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
    ports:
      - "172.17.0.1:8123:8123"   # HTTP interface
      - "172.17.0.1:9000:9000"   # native protocol
    volumes:
      # System logs disabled - they grow forever otherwise.
      - ./deploy/clickhouse/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
      - ./data/clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

networks:
  sandbox_net:
    internal: true
